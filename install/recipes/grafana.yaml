grafana:
  description: "Grafana OSS — observability dashboards (deb / rpm package with systemd unit)"
  check:
    name: "grafana is installed"
    try:
      - "command -v grafana >/dev/null 2>&1 || [ -x /usr/sbin/grafana ]": truthy
    then: 'clog Log -I "  grafana is installed"'
    else: 'clog Log -W "  grafana not found — install with: clog Install grafana"'
  version:
    strategy: github-latest
    repo: grafana/grafana
    tag-prefix: "v"
  platforms:
    darwin/arm64:
      install:
        strategy: brew-install
        package: grafana
    darwin/amd64:
      install:
        strategy: brew-install
        package: grafana
    linux-deb/arm64:
      arch: arm64
      download:
        strategy: github-release-asset
        repo: grafana/grafana
        filter:
          - "grafana_"
          - "_linux_arm64.deb"
      install:
        strategy: install-deb
        sudo: true
    linux-deb/amd64:
      arch: amd64
      download:
        strategy: github-release-asset
        repo: grafana/grafana
        filter:
          - "grafana_"
          - "_linux_amd64.deb"
      install:
        strategy: install-deb
        sudo: true
    linux-rpm/arm64:
      arch: arm64
      download:
        strategy: github-release-asset
        repo: grafana/grafana
        filter:
          - "grafana_"
          - "_linux_arm64.rpm"
      install:
        strategy: install-rpm
        sudo: true
    linux-rpm/amd64:
      arch: amd64
      download:
        strategy: github-release-asset
        repo: grafana/grafana
        filter:
          - "grafana_"
          - "_linux_amd64.rpm"
      install:
        strategy: install-rpm
        sudo: true
