podman:
  description: "Podman — daemonless container engine (macOS: run `podman machine init` after install)"
  check:
    name: "podman is installed"
    try:
      - "podman --version >/dev/null 2>&1": truthy
    then: 'clog Log -I "  podman is installed"'
    else: 'clog Log -W "  podman not found — install with: clog Install podman"'
  platforms:
    darwin/arm64:
      install:
        strategy: brew-install
        package: podman
    darwin/amd64:
      install:
        strategy: brew-install
        package: podman
    linux-deb/arm64:
      install:
        strategy: apt-install
        package: podman
        sudo: true
    linux-deb/amd64:
      install:
        strategy: apt-install
        package: podman
        sudo: true
    linux-rpm/arm64:
      install:
        strategy: dnf-install
        package: podman
        sudo: true
    linux-rpm/amd64:
      install:
        strategy: dnf-install
        package: podman
        sudo: true
