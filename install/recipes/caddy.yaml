caddy:
  description: "Caddy — web server with automatic HTTPS (deb: package + systemd unit; rpm: binary only)"
  check:
    name: "caddy is installed"
    try:
      - "caddy version >/dev/null 2>&1": truthy
    then: 'clog Log -I "  caddy is installed"'
    else: 'clog Log -W "  caddy not found — install with: clog Install caddy"'
  version:
    strategy: github-latest
    repo: caddyserver/caddy
    tag-prefix: "v"
  platforms:
    darwin/arm64:
      install:
        strategy: brew-install
        package: caddy
    darwin/amd64:
      install:
        strategy: brew-install
        package: caddy
    linux-deb/arm64:
      arch: arm64
      download:
        strategy: github-release-asset
        repo: caddyserver/caddy
        filter:
          - "_linux_arm64.deb"
      install:
        strategy: install-deb
        sudo: true
    linux-deb/amd64:
      arch: amd64
      download:
        strategy: github-release-asset
        repo: caddyserver/caddy
        filter:
          - "_linux_amd64.deb"
      install:
        strategy: install-deb
        sudo: true
    linux-rpm/arm64:
      os: linux
      arch: arm64
      download:
        strategy: url-template
        url: "https://github.com/caddyserver/caddy/releases/download/v{version}/caddy_{version}_{os}_{arch}.tar.gz"
      install:
        strategy: extract-tar-binary
        binary: caddy
        dest: /usr/local/bin
        sudo: true
    linux-rpm/amd64:
      os: linux
      arch: amd64
      download:
        strategy: url-template
        url: "https://github.com/caddyserver/caddy/releases/download/v{version}/caddy_{version}_{os}_{arch}.tar.gz"
      install:
        strategy: extract-tar-binary
        binary: caddy
        dest: /usr/local/bin
        sudo: true
