curl:
  description: "curl — command line tool for transferring data with URLs"
  check:
    name: "curl is installed"
    try:
      - "curl --version >/dev/null 2>&1": truthy
    then: 'clog Log -I "  curl is installed"'
    else: 'clog Log -W "  curl not found — install with: clog Install curl"'
  platforms:
    darwin/arm64:
      install:
        strategy: brew-install
        package: curl
    darwin/amd64:
      install:
        strategy: brew-install
        package: curl
    linux-deb/arm64:
      install:
        strategy: apt-install
        package: curl
        sudo: true
    linux-deb/amd64:
      install:
        strategy: apt-install
        package: curl
        sudo: true
    linux-rpm/arm64:
      install:
        strategy: dnf-install
        package: curl
        sudo: true
    linux-rpm/amd64:
      install:
        strategy: dnf-install
        package: curl
        sudo: true
