git:
  description: "Git distributed version control system"
  check:
    name: "git is installed"
    try:
      - "git --version >/dev/null 2>&1": truthy
    then: 'clog Log -I "  git is installed"'
    else: 'clog Log -W "  git not found"'
  platforms:
    darwin/arm64:
      install:
        strategy: brew-install
        package: git
    darwin/amd64:
      install:
        strategy: brew-install
        package: git
    linux-deb/arm64:
      install:
        strategy: apt-install
        package: git
        sudo: true
    linux-deb/amd64:
      install:
        strategy: apt-install
        package: git
        sudo: true
    linux-rpm/arm64:
      install:
        strategy: dnf-install
        package: git
        sudo: true
    linux-rpm/amd64:
      install:
        strategy: dnf-install
        package: git
        sudo: true
