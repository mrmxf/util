ko:
  description: "ko — build Go container images without a Dockerfile"
  check:
    name: "ko is installed"
    try:
      - "ko version >/dev/null 2>&1": truthy
    then: 'clog Log -I "  ko is installed"'
    else: 'clog Log -W "  ko not found — install with: clog install ko"'
  version:
    strategy: github-latest
    repo: ko-build/ko
    tag-prefix: "v"
  platforms:
    darwin/arm64:
      install:
        strategy: brew-install
        package: ko
    darwin/amd64:
      install:
        strategy: brew-install
        package: ko
    linux-deb/arm64:
      os: Linux
      arch: arm64
      download:
        strategy: github-release-asset
        repo: ko-build/ko
        filter:
          - "Linux_arm64"
          - ".tar.gz"
        slsa:
          url-template: "https://github.com/ko-build/ko/releases/download/v{version}/multiple.intoto.jsonl"
          source-uri: "github.com/ko-build/ko"
      install:
        strategy: extract-tar-binary
        binary: ko
        dest: /usr/local/bin
        sudo: true
    linux-deb/amd64:
      os: Linux
      arch: x86_64
      download:
        strategy: github-release-asset
        repo: ko-build/ko
        filter:
          - "Linux_x86_64"
          - ".tar.gz"
        slsa:
          url-template: "https://github.com/ko-build/ko/releases/download/v{version}/multiple.intoto.jsonl"
          source-uri: "github.com/ko-build/ko"
      install:
        strategy: extract-tar-binary
        binary: ko
        dest: /usr/local/bin
        sudo: true
    linux-rpm/arm64:
      os: Linux
      arch: arm64
      download:
        strategy: github-release-asset
        repo: ko-build/ko
        filter:
          - "Linux_arm64"
          - ".tar.gz"
        slsa:
          url-template: "https://github.com/ko-build/ko/releases/download/v{version}/multiple.intoto.jsonl"
          source-uri: "github.com/ko-build/ko"
      install:
        strategy: extract-tar-binary
        binary: ko
        dest: /usr/local/bin
        sudo: true
    linux-rpm/amd64:
      os: Linux
      arch: x86_64
      download:
        strategy: github-release-asset
        repo: ko-build/ko
        filter:
          - "Linux_x86_64"
          - ".tar.gz"
        slsa:
          url-template: "https://github.com/ko-build/ko/releases/download/v{version}/multiple.intoto.jsonl"
          source-uri: "github.com/ko-build/ko"
      install:
        strategy: extract-tar-binary
        binary: ko
        dest: /usr/local/bin
        sudo: true
