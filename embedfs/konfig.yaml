### when clog starts it uses these config values. 
###    1. clog searches for each file in `kfg.try-paths`, in order
###    2. for every match, the config is overlaid on previous configs
###    3. order is user config, then project config - last one wins
###
### `.clog.yaml` in the repo root is THE canonical place for a repo's config.
### The old `clogrc/clog.yaml` is legacy and is no longer searched.

#                        ⇓⇓⇓⇓⇓⇓⇓           ⇓⇓⇓⇓
# ALL YAML KEYS ARE ⇒⇒ lowercase ⇔ with hyphens ⇐⇐ (not underscores) only.
#                        ⇑⇑⇑⇑⇑⇑⇑           ⇑⇑⇑⇑
# ≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡
# Kfg controls the configuration of clog (or anything using clog/Kfg)
#   _  __   __         
#  | |/ /  / _|   __ _ 
#  | ' /  | |_   / _` |
#  | . \  |  _| | (_| |
#  |_|\_\ |_|    \__, |
#                |___/ 
kfg:
  app-key: clog
  # path to the yaml file defining release history - see semver package
  releases-path: "releases.yaml"
  # try to load the following files (in order) to overlay configs
  # NOTE - koanf gets unhappy if relative paths start with "./"
  try-paths:
    - $HOME/.clog.yaml
    - .clog.yaml
# ≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡
# clog.xxx is auto-loaded into the my.App structure
#        _              
#   __  | |  ___   __ _ 
#  / _| | | / _ \ / _` |
#  \__| |_| \___/ \__, |
#                 |___/ 
clog:
  # path to the yaml file defining release history - see semver package
  releases-path: "releases.yaml"  # release & build tracking
  # path to a bash/zsh file that stashes variables between job stages
  stash-path: "tmp/BC-stash.yaml"
  # these are the ENV variables that are searched for by various tools
  # override these to change the actual ENV variables used
  env:
  jumbo:                        # clog Jumbo --help for font & style commands
    font: small
    sample: www.mrmxf.com
  log:           
    level: debug                # debug | info | warn | error - all go to stdErr
    style: pretty               # plain | pretty | json - this sets the default

# ≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡
#        _                   ___   _                 _
#   __  | |  ___   __ _     / __| | |_    ___   __  | |__
#  / _| | | / _ \ / _` |   | (__  | ' \  / -_) / _| | / /
#  \__| |_| \___/ \__, |    \___| |_||_| \___| \__| |_\_\
#                 |___/
check:
# ▬▬▬ pre-build check - generic ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
  pre-build:
    blocks:
      - finally: clog BC stash log -1 check -2 pre-build -I "        branch    $(clog BC git get branch)"
      - finally: clog BC stash log -1 check -2 pre-build -I "       version    $(clog BC gen buildinfo --format version)"
      - finally: clog BC stash log -1 check -2 pre-build -I "      tag-prod    $(clog BC git tag get prod)"
      - finally: clog BC stash log -1 check -2 pre-build -I "          mode    $(clog CI mode)"
      - finally: clog BC stash log -1 check -2 pre-build -I "     hash-head    $(clog BC git hash get head)"
      - try: |
          # CI always checks out clean — skip tree checks to avoid false warnings
          [ -n "$CI" ] || [ -n "$GITHUB_ACTIONS" ] || [ -n "$GITLAB_CI" ] && exit 0
          clog BC git tree is clean
        ok:    clog BC stash log -1 check -2 pre-build -3 "tree clean"  -I "Ok working tree clean"
        catch: |
          XIT=0; FLAG="-W"
          [ "$(clog CI mode)" = "prod" ] && XIT=1 && FLAG="-E"
          clog BC stash log -1 check -2 pre-build -3 "tree clean" $FLAG "   working tree NOT clean"
          exit $XIT
      - name: go.work does not mask the module pins
        try: |
          # A go.work puts sibling modules on the build path in place of the
          # versions go.mod pins, so a tree can build green for months against
          # working-copy source while its pins are inconsistent. Not
          # hypothetical: clog-sample paired bc v0.13.0 with buildinfo v0.12.0
          # for days, and the first CI run it ever had was the first thing to
          # notice.
          #
          # A runner has no workspace, so in CI this is an error. On a laptop
          # the workspace is usually deliberate - it is how util and its
          # consumers are developed together - so there it is a warning.
          #
          # `go env GOWORK` prints the literal "off" when GOWORK=off, so an
          # emptiness test alone would read that as a workspace build.
          w="$(go env GOWORK 2>/dev/null)"
          [ -z "$w" ] || [ "$w" = "off" ] && exit 0
          [ -n "$CI" ] || [ -n "$GITHUB_ACTIONS" ] || [ -n "$GITLAB_CI" ] && exit 1
          exit 0
        ok: |
          w="$(go env GOWORK 2>/dev/null)"
          if [ -z "$w" ] || [ "$w" = "off" ]; then
            clog BC stash log -1 check -2 pre-build -3 "go.work" -I "Ok building from the go.mod pins"
          else
            clog BC stash log -1 check -2 pre-build -3 "go.work" -W "   go.work is active: this build does NOT use the go.mod pins (check with GOWORK=off go build ./...)"
          fi
        catch: |
          clog BC stash log -1 check -2 pre-build -3 "go.work" -E "   CI is using $(go env GOWORK) - the go.mod pins are not what is being built"
          exit 1

      - try: |
          [ -n "$CI" ] || [ -n "$GITHUB_ACTIONS" ] || [ -n "$GITLAB_CI" ] && exit 0
          # the check wants "not ahead"; `is ahead` is true when it IS ahead
          ! clog BC git tree is ahead
        ok:    clog BC stash log -1 check -2 pre-build -3 "tree ahead"  -I "Ok working tree not ahead of origin"
        catch: clog BC stash log -1 check -2 pre-build -3 "tree ahead"  -W "   working tree is ahead of origin"
      - try: |
          [ -n "$CI" ] || [ -n "$GITHUB_ACTIONS" ] || [ -n "$GITLAB_CI" ] && exit 0
          # the check wants "not behind"; `is behind` is true when it IS behind
          ! clog BC git tree is behind
        ok:    clog BC stash log -1 check -2 pre-build -3 "tree behind" -I "Ok working tree not behind origin"
        catch: clog BC stash log -1 check -2 pre-build -3 "tree behind" -W "   working tree is behind origin"
      - try: |
          [ -n "$CI" ] || [ -n "$GITHUB_ACTIONS" ] || [ -n "$GITLAB_CI" ] && exit 0
          # the check wants "nothing dangling"; `has unstaged` is true when there are
          ! clog BC git tree has unstaged
        ok:    clog BC stash log -1 check -2 pre-build -3 "unstaged"    -I "Ok working tree has no dangling changes"
        catch: clog BC stash log -1 check -2 pre-build -3 "unstaged"    -W "   working tree has unstaged changes"

# ▬▬▬▬ golang checker generic ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
  golang:
    blocks:
      - name: Static Check
        try: |
          # `staticcheck ./... | exit 1` was always 1: a pipeline's status is its
          # LAST command. The catch then always ran, logged -S and never exited
          # non-zero - and a section fails only when its catch does. So this gate
          # reported success whatever staticcheck found. `|| exit 1` is the fix.
          which staticcheck >/dev/null 2>&1 || {
            clog BC stash log -1 check -2 golang -3 "staticcheck" -E "   staticcheck is not installed - go install honnef.co/go/tools/cmd/staticcheck@latest"
            exit 1
          }
          staticcheck ./... || exit 1
        ok: clog BC stash log -1 check -2 golang -3 "staticcheck" -S "   staticcheck passed"
        catch: |
          clog BC stash log -1 check -2 golang -3 "staticcheck" -E "   staticcheck failed"
          echo "$STDOUTERR"
          exit 1
      - name: golangci-lint
        try: |
          # A gate that cannot run is not a gate that passed. `clog build` means
          # ready to push, so a missing tool is a failure - and clog refuses to
          # install it behind your back, because a verb that quietly pulls
          # binaries onto the machine while claiming to check a branch is the
          # wrong supply-chain posture. Refuse, name the tool, print the line.
          which golangci-lint >/dev/null 2>&1 || {
            clog BC stash log -1 check -2 golang -3 golangci -E "golangci-lint is not installed - clog Install golangci-lint"
            exit 1
          }
          golangci-lint run --timeout=5m
        ok:   clog BC stash log -1 check -2 golang -3 golangci -S "golangci-lint passed"
        catch: |
          clog BC stash log -1 check -2 golang -3 golangci -E "golangci-lint found issues"
          exit 1
# ▬▬▬▬ lint - one check phase, dispatched per stack ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
#  Lint examines the SOURCE, and a repo has as many source subjects as it has
#  stacks - so this resolves per stack rather than repo-wide. TinyGo is the
#  reason: files behind `//go:build tinygo` import machine packages that will
#  not compile for the host, so a typecheck-based linter reports errors that
#  are not errors unless it is told the target.
  lint:
    blocks:
      - name: lint
        try: |
          ERR=0
          for s in $(clog CI stack list names --stack "${CLOG_STACK:-}"); do
            t="$(clog CI stack get type --stack "$s")"
            case "$t" in
              hugo)
                clog BC stash log -1 check -2 lint -3 "$s" -I "lint $s (hugo): no linter configured yet"
                ;;
              golang|golang-lib|container)
                clog Check golang || ERR=1
                ;;
              tinygo)
                # the firmware half needs build tags the host half must not see
                GOFLAGS="-tags=tinygo" clog Check golang || ERR=1
                ;;
              *)
                clog BC stash log -1 check -2 lint -3 "$s" -W "no lint rule for stack type $t"
                ;;
            esac
          done
          exit $ERR
        ok:    clog BC stash log -1 check -2 lint -S "lint passed"
        catch: |
          clog BC stash log -1 check -2 lint -E "lint found issues"
          exit 1

# ▬▬▬▬ test - one check phase, dispatched per stack ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
#  The golang, golang-lib and container stacks all name `test` in their default
#  chk list, and until v1.0.0 no check group of that name existed - so every
#  repo adopting one of those stacks resolved a phase that could not run. It was
#  invisible because `clog BC flow` takes phase names on trust and clog-sample
#  happened to define check.test locally.
#
#  Like lint, this dispatches per stack rather than repo-wide: a tree holding
#  firmware beside a host tool has two test commands, not one.
  test:
    blocks:
      - name: test
        try: |
          ERR=0
          for s in $(clog CI stack list names --stack "${CLOG_STACK:-}"); do
            t="$(clog CI stack get type --stack "$s")"
            case "$t" in
              golang|golang-lib|container)
                go vet ./...  || ERR=1
                go test ./... || ERR=1
                ;;
              tinygo)
                # the host half only; firmware needs hardware to run on
                go vet ./...  || ERR=1
                go test ./... || ERR=1
                ;;
              hugo)
                clog BC stash log -1 check -2 test -3 "$s" -I "test $s (hugo): no test suite"
                ;;
              *)
                clog BC stash log -1 check -2 test -3 "$s" -W "no test rule for stack type $t"
                ;;
            esac
          done
          exit $ERR
        ok:    clog BC stash log -1 check -2 test -S "tests passed"
        catch: |
          clog BC stash log -1 check -2 test -E "tests failed"
          echo "$STDOUTERR"
          exit 1

# ▬▬▬▬ scan - two axes: the worktree, then each target's artifact ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
#  `vuln` and `secrets` name WHAT is examined, never which tool examines it, so
#  swapping Trivy is a change here rather than a config migration across every
#  repo. The source sweep runs in every repo with or without targets: that is
#  the axis covering a Go library, a Hugo asset pipeline and a TinyGo module
#  graph, none of which have a scannable deployable at all.
  scan:
    blocks:
      - name: trivy present
        try: |
          which trivy >/dev/null 2>&1 || {
            clog BC stash log -1 check -2 scan -3 trivy -E "trivy is not installed - clog Install trivy"
            exit 1
          }
        ok:    clog BC stash log -1 check -2 scan -3 trivy -S "trivy present"
        catch: exit 1

      - name: source sweep
        try: |
          eval "$(clog CI scan show --format env)"
          mkdir -p tmp/scan
          ERR=0
          if [ "$scan_source_vuln" != "none" ]; then
            ARGS="--scanners vuln --severity $scan_source_severity --format sarif --output tmp/scan/source-vuln.sarif"
            [ "$scan_source_ignore_unfixed" = "true" ] && ARGS="$ARGS --ignore-unfixed"
            [ -f "$scan_source_ignorefile" ] && ARGS="$ARGS --ignorefile $scan_source_ignorefile"
            [ -n "$scan_source_skip_dirs" ] && ARGS="$ARGS --skip-dirs $scan_source_skip_dirs"
            # `repo` and `fs` are both a filesystem scan to trivy; the names say
            # what is being examined, which is the part that has to survive a
            # change of scanner.
            trivy fs $ARGS "$scan_source_ref" || ERR=1
          fi
          if [ "$scan_source_secrets" = "true" ]; then
            trivy fs --scanners secret --format sarif \
              --output tmp/scan/source-secret.sarif "$scan_source_ref" || ERR=1
          fi
          exit $ERR
        ok:    clog BC stash log -1 check -2 scan -3 source -S "source sweep clean"
        catch: |
          clog BC stash log -1 check -2 scan -3 source -E "source sweep found problems"
          echo "$STDOUTERR"
          exit 1

      - name: artifact sweeps
        try: |
          ERR=0
          for t in $(clog CI scan list targets --stack "${CLOG_STACK:-}"); do
            eval "$(clog CI scan show --format env --target "$t")" || { ERR=1; continue; }
            [ "$scan_artifact_vuln" = "none" ] && [ "$scan_artifact_secrets" != "true" ] && continue
            case "$scan_artifact_vuln" in
              image)
                # a tarball on a build that is not deploying, a reference when it is
                REF="$scan_artifact_ref"
                [ -f tmp/image.tar ] && REF="--input tmp/image.tar"
                trivy image --severity "$scan_artifact_severity" --format sarif \
                  --output "tmp/scan/$t-vuln.sarif" $REF || ERR=1
                ;;
              fs)
                trivy fs --scanners vuln --severity "$scan_artifact_severity" --format sarif \
                  --output "tmp/scan/$t-vuln.sarif" "$scan_artifact_ref" || ERR=1
                ;;
            esac
            if [ "$scan_artifact_secrets" = "true" ] && [ -d "$scan_artifact_ref" ]; then
              trivy fs --scanners secret --format sarif \
                --output "tmp/scan/$t-secret.sarif" "$scan_artifact_ref" || ERR=1
            fi
          done
          exit $ERR
        ok:    clog BC stash log -1 check -2 scan -3 artifact -S "artifact sweeps clean"
        catch: |
          clog BC stash log -1 check -2 scan -3 artifact -E "an artifact sweep found problems"
          echo "$STDOUTERR"
          exit 1

# ▬▬▬▬ hugo checker generic ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
  hugo:
    blocks:
      - name: wsl Zone.Identifier files
        try: |
          [ -z "$(find . -name '*Zone.Identifier' -not -path '*/node_modules/*')" ]
        ok: clog BC stash log -1 check -2 hugo -3 "Zone.Identifier" -I "no Zone.Identifier present"
        catch: |
          eval "$(clog Crayon)"
          n=$(find . -name '*Zone.Identifier' -not -path '*/node_modules/*'|wc -l)
          clog   BC stash log -1 check -2 hugo -3 "Zone.Identifier" -E "Delete $n Zone.Identifier files made by Windows"
          while IFS= read -r line; do
            fn="$(echo ${line:2}|cut  -d ":" -f "1")"
            id="$(echo ${line:2}|cut  -d ":" -f "2")"
            clog BC stash log -1 -2 hugo -3 "Zone.Identifier"  check -E "      ❌$cF $fn$cX:$cW$id"
          done < <(find . -name '*Zone.Identifier' -not -path '*/node_modules/*')
          clog   BC releases is build prod && exit 1

      - name: golang version
        try: clog BC semver satisfies "$(clog project needs golang)"  "$(clog project has golang)"
        ok: clog  BC stash log -1 check -2 hugo -3 "golang version" -I "golang $(clog project has golang) is up to date"
        catch: |
          clog    BC stash log -1 check -2 hugo -3 "golang version" -W "golang: bad version. go.mod needs $(clog project needs golang), got $(clog project has golang)"

      - name: hugo version
        try: clog BC semver satisfies "$(clog project needs hugo)"  "$(clog project has hugo)"
        ok: clog  BC stash log -1 check -2 hugo -3 "hugo version" -I "hugo $(clog project has hugo) is up to date"
        catch:  |
          clog    BC stash log -1 check -2 hugo -3 "hugo version" -W "hugo: bad version. Need $(clog project needs hugo), got $(clog project has hugo)"

      - name: git-lfs version
        try:  clog BC semver satisfies "$(clog project has git-lfs)"     "$(clog project needs git-lfs)"
        ok: clog BC stash log -1 check -2 hugo -3 "git-lfs version" -I "git-lfs $(clog project has git-lfs) good"
        catch: |
          lfs="$(clog project has git-lfs)"
          [ -z "$lfs" ] && clog BC stash log -1 check -2 hugo -3 "git-lfs version" -W "git-lfs not installed"
          [ -n "$lfs" ] && clog BC stash log -1 check -2 hugo -3 "git-lfs version" -W "git-lfs: bad version. Need $(clog project needs git-lfs), got $(clog project has git-lfs)"

      - name: docker?
        try: which docker 2>/dev/null
        ok: clog BC stash log -1 check -2 hugo -3 docker -I "docker ok"
        catch: |
          clog BC stash log -1 check -2 hugo -3 docker -E "docker not on path"
          [ "$(clog CI mode)" = prod ] && exit 1

      - name: theme replacements
        try: |
          themeReplacements="$(yq -r '.replacements' config/_default/module.yaml)"
          [[ "null" == "$themeReplacements" ]] && exit 0
          exit 1
        ok: clog BC stash log -1 check -2 hugo -3 theme -I "theme will be pulled from github"
        catch: |
          activeReplacement="$(yq -r '.replacements' config/_default/module.yaml)"
          clog BC stash log -1 check -2 hugo -3 theme -E "local theme replacement kill github action ($activeReplacement)"
          exit 1

      - name: remote production ref had been specified
        try:  '[ -z "$(clog BC git tag get prod)" ] && exit 1 || exit 0'
        ok: clog    BC stash log -1 check -2 hugo -3 "remote ref" -I "tag($(clog BC git tag get prod)) specified for production"
        catch: clog BC stash log -1 check -2 hugo -3 "remote ref" -E "No flow:main build:prod exists in releases.yaml";exit 1

      - name: remote production ref exists
        try: |
          tag="$(clog BC git tag get prod)"
          [ -z "$(git ls-remote --tags 2>/dev/null|grep $tag)" ] && exit 1 || exit 0
        ok: clog     BC stash log -1 check -2 hugo -3 "remote ref ok" -I "tag($(clog BC git tag get prod)) exists at remote origin"
        catch: 'clog BC stash log -1 check -2 hugo -3 "remote ref ok" -E "git ls-remote --tags missing tag $(clog BC git tag get prod)";exit 1'
# ▬▬▬ tool check generic ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
# Generic baseline — projects override check.tools in their .clog.yaml
  tools:
    blocks:
      - name: golang
        try: clog BC semver satisfies "$(clog project needs golang)" "$(clog project has golang)"
        ok:   clog BC stash log -1 check -2 tools -3 golang -I "golang $(clog project has golang) ok"
        catch: clog BC stash log -1 check -2 tools -3 golang -E "wrong go version. Need $(clog project needs golang)"
      - name: yq
        try: which yq 2>/dev/null
        ok:   clog BC stash log -1 check -2 tools -3 yq -I "yq present"
        catch: clog BC stash log -1 check -2 tools -3 yq -E "yq not present"
      - name: aws cli v2
        try: |
          vv="$(aws --version 2>/dev/null|grep -oE '\/[0-9]+\.[0-9]+\.[0-9]+'|head -1|tr -d [/]|head -c 2)"
          [[ "2." == "$vv" ]]
        ok:   clog BC stash log -1 check -2 tools -3 aws -I "aws cli v2 present"
        catch: clog BC stash log -1 check -2 tools -3 aws -E "aws cli v2 not present."
# ≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡
#               _                       _
#   ||_  _ _   (_)  _ __   _ __   ___  | |_   ___
#  (_-< | ' \  | | | '_ \ | '_ \ / -_) |  _| (_-<
#  / _/ |_||_| |_| | .__/ | .__/ \___|  \__| /__/
#   ||             |_|    |_|
snippets:
  # ▼▼▼ bc-override snippets ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  #        _         
  #   ||_ | |__   __ 
  #  (_-< | '_ \ / _|
  #  / _/ |_.__/ \__|
  #   ||             
  # ▼▼▼ the four verbs ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  #
  #   clog watch                # interactive loop: hugo server, go run, tinygo monitor
  #   clog build dev --fast     # skip every gate - a long way still to go
  #   clog build dev|prod       # every gate passed - ready to push
  #   clog deploy dev|prod      # publish what was built
  #
  #  Each takes an optional stack name. build and deploy take EVERY stack by
  #  default, because the rigorous thing should be what you get for free - and
  #  because a first-stack default would mean that adding a stack to ci.stack
  #  silently halves what CI builds. watch takes the FIRST stack, since a watch
  #  command is an interactive foreground process - and it says what it ignored.
  #
  #  A repo that defines its own `build` in .clog.yaml still wins: project
  #  config is overlaid after this one.
  #
  #  verb-args parses [dev|prod] [stack|all] [--fast] by VALUE rather than by
  #  position, which is what lets `clog build bonfire` and `clog build prod all`
  #  both work without a flag. That is why `all`, `dev` and `prod` are refused
  #  as stack names at parse time, in ci/stack.go.
  verb-args: |
    VERB_MODE=""; VERB_STACK=""; VERB_FAST=""
    for a in "$@"; do
      case "$a" in
        dev|prod) VERB_MODE="$a" ;;
        --fast)   VERB_FAST="--fast" ;;
        -*)       ;;
        *)        VERB_STACK="$a" ;;
      esac
    done
    if [ -n "$VERB_MODE" ]; then
      echo "export CLOG_MODE=$VERB_MODE"
      echo "VERB_MODE=$VERB_MODE"
    else
      m="$(clog CI mode 2>/dev/null | grep -xE 'dev|prod' | head -1)"
      echo "VERB_MODE=${m:-dev}"
    fi
    echo "VERB_STACK=$VERB_STACK"
    echo "VERB_FAST=$VERB_FAST"

  build: |
    eval "$(clog verb-args "$@")" || exit 1
    clog CI stack echo building --stack "$VERB_STACK" --mode "$VERB_MODE" || exit 1
    # check phases run per stack too: `clog build bonfire` must not lint, or
    # scan the artifacts of, a stack it did not build.
    export CLOG_STACK="$VERB_STACK"
    MAKE="$(clog CI stack list make --stack "$VERB_STACK")" || exit 1
    if [ -n "$VERB_FAST" ]; then
      clog BC flow --reset --fast --build "$MAKE"
    else
      CHK="$(clog CI stack list chk --stack "$VERB_STACK")" || exit 1
      clog BC flow --reset --check "$CHK" --build "$MAKE"
    fi

  watch: |
    eval "$(clog verb-args "$@")" || exit 1
    clog CI stack echo watching --stack "$VERB_STACK" --watch || exit 1
    CMD="$(clog CI stack get watch --stack "$VERB_STACK")" || exit 1
    [ -z "$CMD" ] && clog Log -E "no watch command for that stack" && exit 1
    eval "$CMD"

  deploy: |
    eval "$(clog verb-args "$@")" || exit 1
    clog CI stack echo deploying --stack "$VERB_STACK" --mode "$VERB_MODE" || exit 1
    clog CI deploy --mode "$VERB_MODE" --stack "${VERB_STACK:-all}"

  bc-artifacts: echo "tmp/artifacts"
  bc-main-prod-tag: yq -r 'first(.[] | select(.type=="main" and .build=="prod") | .version)' "$(clog BC releases get path)"
  bc-log-divider: eval "$(clog Crayon)";for i in {1..8};do HR="$HR\e[09${i}m▬▬▬▬▬▬▬▬▬$cE|";done;printf "$HR$cX\n"
  # worker function instagram ------------------------------------------------------------------------------------------
  bc-instagram: |
    eval "$(clog Crayon)" # setting & highlights
    clog BC stash log -1 build -2 instagram  -W  "    ✖️ $cC clog instagram$cW not implemented yet$cX - come back later"
    exit 0
  # WORKER v0.8.6 - checkout the main-prod version of a repo -----------------------------------------------------------
  bc-main-prod-checkout: |
    eval "$(clog Source project config); $(clog Crayon)" # setting & highlights
    TAG="$(clog bc-main-prod-tag)"

    ERR=0
    clog BC stash log -1 build -2 "prod-checkout" -3 start -I "$STEP.$(((++s))).⚒️  bc-main-prod-checkout  $phase→$cF setup queries for daily build/"
    [ -z "$TAG" ]&&clog BC stash log -2 "prod-checkout" -3 "tag" -E "releases.yaml has no entry with type=main build=prod"&&exit (((++ERR)))
    git checkout "$TAG"
    [ $? -gt 0 ]&&clog  BC stash log -2 "prod-checkout" -3 "checkout" -E "cannot checkout to tag $cE$TAG"&&exit (((++ERR)))

    # we are now checked out to the production snapshot $TAG
    # releases.yaml and scripts

  # ▼▼▼ bc-deploy-s3 ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  bc-deploy-s3: |
    # $YAML=array with many lines like this
    #     - {src:"tmp/clog-amd-lnx",    dst:"$BKT/clog-amd-lnx",    cHi:"$cLnx",cFn:"$cAmd"}
    fAwsCp() {
      # this function will perform aws cp on each file with cHighlight and cFilename
      local src dst colHi colFn
      src="$1";   shift
      dst="$1";   shift
      colHi="$1"; shift
      colFn="$1"; shift

      [ ! -f "$src" ] && clog BC stash log -1 build -2 deploy-s3 -3 pre-flight -W "$colHi(skip) $colFn$src$cX - not found" && return

      size="$(du -sh $src|grep -oE '([0-9\.]+[KMGTP])')"
      clog  BC stash log -1 build -2 deploy-s3 -3 aws-cp -I "$colHi($size)$colFn  $src$cX → s3://$dst"
      aws s3 cp --quiet "$src" "s3://$dst"
      return $?
    }
    # --------------------------------------------------------------------------
    eval "$(clog Source project config); $(clog Crayon)" # setting & highlights
    flow="$1"
    phase="$2"

    ERR=0
    vAws="$(aws --version 2>/dev/null|grep -oE '[0-9]+\.[0-9]+\.[0-9]+'|head -1)"
    ((ERR+=$?)); [ $ERR -gt 0 ] && clog BC stash log -1 build -2 deploy-s3 -3 aws-version  -E "bc-deploy-s3 cannot find aws cli"

    #check YAML not empty
    [ -z "$YAML" ] && clog BC stash log -1 build -2 deploy-s3 -3 yaml  -E "bc-deploy-s3 has no YAML entries to parse" && ((ERR++))

    #check YAML parses and is an array with length
    yLen="$(echo "$YAML"|yq 'length' 2>/dev/null)"
    [ "$?" -gt 0    ] && clog BC stash log -1 build -2 deploy-s3 -3 yaml -E "bc-deploy-s3 YAML cannot be parsed" && ((ERR++))
    [ "$yLen" -eq 0 ] && clog BC stash log -1 build -2 deploy-s3 -3 yaml -E "bc-deploy-s3 YAML array has zero length" && ((ERR++))

    # in github actions, the bucket env is S3_BUCKET unless overridden
    [ -n "$GITHUB_ACTIONS" ] && [ -z "$CLOG_BUCKET" ] && CLOG_BUCKET="$S3_BUCKET"

    # --------------------------------------------------------------------------
    clog BC stash log -1 build -2 deploy-s3 -3 yaml -I "🚀 deploy-s3 $cC$PROJECT $cX using aws cli $cF $vAws$cX for ${#SRC[@]} files"

    n=0
    while [ $n -lt $yLen ]; do
      SRC="$(printf "%s" "$YAML"|yq -r ".[$n].src")"
      DST="$(printf "%s" "$YAML"|yq -r ".[$n].dst")"
      fAwsCp "$SRC" "$DST" "" ""; ERR=$((ERR+$?))
      ((n++))
    done
    
    if [ $ERR -gt 0 ]; then
      clog BC stash log -1 build -2 deploy-s3 -3 status -E "❌ failed with $ERR errors"
      exit $(((ERR+=$?)))
    fi
    clog BC stash log -1 build -2 deploy-s3 -3 status -S "✅ ok"
    exit 0

  # ▼▼▼ bc-hugo ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  bc-hugo: |
    eval "$(clog Source project config); $(clog Crayon)"  # setting & highlights
    flow="$1"
    phase="$2"

    ERR=0
    clog BC stash log -1 build -2 hugo -3 start -I "⚒️  build hugo $phase→$cF kodata/"

    # Content may be a content/ directory OR a module mount declared in
    # module.yaml. Ask hugo what it can actually see: a mount-only repo is
    # legitimate and must build without a symlink.
    if [ -z "$(hugo list all 2>/dev/null | head -1)" ]; then
      clog BC stash log -1 build -2 hugo -3 content -E "⚒️  build hugo has no content - no content/ dir and no module mount"
      exit 1
    fi
    clog BC stash log -1 build -2 hugo -3 purge -I "$STEP.$(((++s))). purge$cF kodata/$cX, build site"
    rm -rf kodata/*

    opt="$opt --buildDrafts --buildFuture --buildExpired"
    [ "$(clog CI mode)" = prod ] && opt=""
    # A site published under a path (project Pages, a staging host) needs its
    # base URL at build time or every link is wrong. Comes from ci.modes.
    baseUrl="$(clog CI mode get base-url)"
    [ -n "$baseUrl" ] && opt="$opt --baseURL $baseUrl"
    clog BC stash log -1 build -2 hugo -3 hugoBuild -I "$STEP.$(((++s))). build hugo $phase→${cF}kodata/$cC $opt"
    hugo build --minify --logLevel info $opt
    ((ERR+=$?))

    if [ $ERR -gt 0 ]; then
      clog BC stash log -1 build -2 hugo -3 hugoBuild -E "❌ hugo build to kodata/ failed with $ERR errors"
      exit $ERR
    fi
    clog BC stash log -1 build -2 hugo -3 hugoBuild -S "✅ hugo build to kodata/ ok"
    
  # ▼▼▼ bc-golang ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  #  $EXE   is the executable name - overrides the default of $PROJECT
  #  $TITLE is the title string for semver
  #  artifacts appear in tmp/
  #  you may have to make a project copy of this function to make semver work
  bc-golang: |
    # version stamp from git (clog BC gen buildinfo), not releases.yaml. prod mode
    # refuses anything but a clean release tag, so a prod binary is a tag.
    fGoBuild(){
      local gofile=$(printf "%-30s" "$1"); shift
      local goos="$1"; shift
      local goarch="$1"; shift

      # set colors for printing logs
      local cos="$cLnx"
      [[ "$goos" == "darwin" ]] && cos=$cMac
      [[ "$goos" == "windows" ]] && cos=$cWin
      local car="$cArm"
      [[ "$goarch" == "amd64" ]] && car=$cAmd

      # determine build local OS & cpu
      cpu="${cAmd}amd$cX" && case $(uname -m) in arm*) cpu="${cArm}arm$cX";; esac
      case "$(uname -s)" in
        Linux*)  bOSV=${cLnx}Linux$cX;;
        Darwin*)  bOSV=${cMac}Mac$cX;;
              *)  bOSV="untested:$(uname -s)";;
      esac

      # pretty format platform strings
      pad=$((17-${#goos}-${#goarch}))
      spaces="$(echo '----------'|head -c $pad)"
      printf -v tPlatform "for %s %s" "$cos$goos$cX/$car$goarch$cX" "$spaces"
      printf -v bPlatform "(built on %14s)" "$bOSV/$cpu"

      buildMsg="$cos$gofile$cX $tPlatform $bPlatform"
      clog BC stash log -1 build -2 golang -3 fGoBuild -I "$buildMsg"

      GOOS="$goos" GOARCH="$goarch" go build -o $gofile -ldflags "$lds"
      err=$?
      if [ $err -gt 0 ]; then
        clog BC stash log -1 build -2 golang -3 fGoBuild -E "Linker data string was:$cC -ldflags \"$lds\""
        clog BC stash log -1 build -2 golang -3 fGoBuild -E "$buildMsg ...  build failed"
        return $err
      fi
      # Go silently ignores -X for a symbol the binary does not contain, which
      # is how every build shipped "-dev" from 2026-06 to 2026-09. Prove it landed.
      if ! go tool nm $gofile 2>/dev/null | grep -q " $linkerPath\$"; then
        clog BC stash log -1 build -2 golang -3 fGoBuild -E "$buildMsg ... $linkerPath is not in the binary - the version stamp would be lost"
        return 1
      fi
      size="$(du --apparent-size --block-size=M $gofile)"
      clog BC stash log -1 build -2 golang -3 fGoBuild -I "$buildMsg ... $size"
    }
    eval "$(clog Source project config); $(clog Crayon)" # setting & highlights
    [ -z "$EXE" ] && clog BC stash log -1 build -2 golang -3 gobuild -E "\$EXE must be set to the target filename" && exit 1
    [ -z "$TITLE" ]&&clog BC stash log -1 build -2 golang -3 gobuild -E "\$TITLE must be set to the target's printable name" && exit 1
    ERR=0

    mode="$(clog CI mode 2>/dev/null | grep -xE 'dev|prod' | head -1)"; mode="${mode:-dev}"
    linkerPath="$(clog BC get linkerpath)"
    # $FLAVOUR marks the build edition (+plain, +mrmxf) so two binaries built
    # from different main packages can be told apart at runtime. Optional.
    lds="$(clog BC gen buildinfo "$mode" --format ldflags --name "$EXE" --title "$TITLE" --flavour "${FLAVOUR:-}")" || {
      clog BC stash log -1 build -2 golang -3 gobuild -E "❌ no build info for a $mode build - see the error above"
      exit 1; }
    version="$(clog BC gen buildinfo "$mode" --format version)"

    clog BC stash log -1 build -2 golang -3 start -I "⚒️  golang build $EXE $version ($mode) →$cF tmp/$EXE-cpu-os"

    # ensure tmp folder exists
    mkdir -p tmp
    app="$EXE"                             # command you type to run the app

      fGoBuild tmp/$app-amd-lnx     linux   amd64; ((ERR+=$?))
    # fGoBuild tmp/$app-amd-win.exe windows amd64; ((ERR+=$?))
      fGoBuild tmp/$app-amd-mac     darwin  amd64; ((ERR+=$?))
      fGoBuild tmp/$app-arm-lnx     linux   arm64; ((ERR+=$?))
    # fGoBuild tmp/$app-arm-win.exe windows arm64; ((ERR+=$?))
      fGoBuild tmp/$app-arm-mac     darwin  arm64; ((ERR+=$?))

    if [ $ERR -gt 0 ]; then
      clog BC stash log -1 build -2 golang -3 status -E "❌ golang build failed with $ERR errors"
      exit $ERR
    fi
    clog BC stash log -1 build -2 golang -3 status -S "✅ golang build ok"

  # ▼▼▼ bc-ko ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  bc-ko: |
    eval "$(clog Source project config); $(clog Crayon)" # setting & highlights

    ERR=0
    # image tags from git + mode (releases.yaml is history): prod builds a clean
    # release tag -> v1.2.3 + latest; dev -> v1.2.3-dev.3.gabc1234 + latest-dev
    mode="$(clog CI mode 2>/dev/null | grep -xE 'dev|prod' | head -1)"; mode="${mode:-dev}"
    tag1="$(clog BC gen buildinfo "$mode" --format docker-tag)" || exit 1
    tag2="latest"; [ "$mode" = prod ] || tag2="latest-dev"

    clog BC stash log -1 build -2 ko -3 start -I "⚒️  build ko →$cU hub.docker.com/$DOCKER_NS/$PROJECT:$cW$tag1$cX and$cW $tag2$cX"

    # config is in .ko.yaml
    # use the default docker repo unless told otherwise
    [ -z "$KO_DOCKER_REPO" ] && KO_DOCKER_REPO="$DOCKER_NS"
    export KO_DOCKER_REPO                                      # push to repo
    export KO_CONFIG_PATH=".ko.yaml"                           # build options
    export KO_DATA_DATE_EPOCH=$(git log -1 --format='%ct')     # date on image

    wd="$(pwd)"
    mkdir -p "$wd/tmp"
    VERBOSE="" # --verbose
    cd www-podserver/
    # A LOCAL BUILD NEVER PUSHES. `clog build` means "am I ready to push", so on
    # a laptop and on any run that is not deploying it must not mutate the
    # outside world - and scanning an image that is already public inverts the
    # point of scanning it. Such a run writes a tarball, and the artifact sweep
    # reads that tarball.
    #
    # A deploying CI run still pushes from here, because there is no
    # container-registry deployer yet: ci/deploy.go registers github-pages and
    # nothing else, so `clog CI deploy` cannot publish an image. Until that
    # deployer exists, moving the push out of the build would simply mean the
    # image never reaches the registry. See ci/SCANNING.md.
    #
    # --sbom=spdx (was none): the SPDX document is the cheapest accurate input
    # for scanning a distroless image, and throwing it away cost us the scan.
    if [ "${do_deploy:-false}" = true ]; then
      ko build $VERBOSE --base-import-paths --sbom=spdx --tags "$tag1" --tags "$tag2" .
      ((ERR+=$?))
    else
      ko build $VERBOSE --base-import-paths --sbom=spdx --push=false \
        --tarball="$wd/tmp/image.tar" --tags "$tag1" .
      ((ERR+=$?))
    fi
    cd "$wd"
    if [ $ERR -gt 0 ]; then
      clog BC stash log -1 build -2 ko -3 status -E "❌ failed $PROJECT:$tag1 and $tag2"
      exit $(((ERR+=$?)))
    fi
    clog BC stash log -1 build -2 ko -3 status -S "✅ ok $PROJECT:$tag1 and $tag2"

  # ▼▼▼ dev ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  #             _
  #   ||_    __| |  ___  __ __
  #  (_-<   / _` | / -_) \ V /
  #  / _/   \__,_| \___|  \_/
  #   ||
  dev:
    godoc: |
      OpenCMD="xdg-open"
      [[ -n "$WSL_DISTRO_NAME" ]] && OpenCMD="explorer.exe"
      [[ "$OSTYPE" == "darwin"* ]] && OpenCMD="open"
      PORT="6060"
      URL="http://localhost:$PORT/pkg/$(go list -m)"
      eval "$(clog Crayon)"
      clog Log -I "Running godoc on port $PORT"
      godoc -http=localhost:$PORT &
      clog Log -I "Use$cC kill $!$cX to stop or$cC ps|grep godoc$cX to list process"
      sleep 2
      clog Log -I "open$cU $URL$cX with$cC $OpenCMD"
      $OpenCMD $URL
      exit 0
    godocslurp: |
      eval "$(clog Crayon)"
      DST="./tmp/kodocs"
      PKG="$(go list -m)"
      PORT="6060"
      if $(which wget > /dev/null); then
        clog Log -I "Slurping godocs into$cF $DST$cX as a static website"
      else
        clog Log -E "${cC}wget$cX not installed"
        exit 1
      fi
      if $(wget -q --spider --timeout=2 http://localhost:$PORT); then
        clog Log -I "Slurping $PKG with wget + refactoring to be root of fs"
      else
        clog Log -W "No response on port $PORT, try$cC clog dev godoc$cX"
        exit 1
      fi
      mkdir -p $DST
      rm -rf "$DST"  && mkdir -p "$DST"
      echo "check tmp/kodocs"
      # wget parameters
      # (-r --recursive)(-np --no-parent)(-k --convert-links)(-p --page-requisites)
      # (-E --adjust-extension)(-e --execute)(-P --directory-prefix)

      # Download the package documentation
      wget -r -np -k -p -E --no-host-directories --cut-dirs=2 -e robots=off -P "$DST" http://localhost:$PORT/pkg/$PKG/
      # Download the godoc static assets (CSS, JS, etc.) to the root
      wget -r -np -k -p -E --no-host-directories              -e robots=off -P "$DST" http://localhost:$PORT/lib/
      if [ $? -gt 0]; then
        clog Log -E "wget failed"
      else
        clog Log -I "Slurping with wget"
      fi

  # ▼▼▼ docker ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  #             _              _
  #   ||_    __| |  ___   __  | |__  ___   _ _
  #  (_-<   / _` | / _ \ / _| | / / / -_) | '_|
  #  / _/   \__,_| \___/ \__| |_\_\ \___| |_|
  #   ||
  #https://www.docker.com/blog/multi-arch-images/
  docker:
    initx: |
      # install qemu to emulate arm for building
      docker run --privileged --rm tonistiigi/binfmt --install all
      docker buildx create --name army
      docker buildx use army
  # ▼▼▼ git - use BC variants if possible ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  #                 _   _
  #   ||_    __ _  (_) | |_
  #  (_-<   / _` | | | |  _|
  #  / _/   \__, | |_|  \__|
  #   ||    |___/
  git:
    # IMPORTANT ZSH gets confused with "--" so use always use quotes to prevent null output
    # IMPORTANT YAML may parse logical expressions into arrays of strings e.g. [ -z "foo" ]
    # IMPORTANT use quotes carefully '[ -z "foo" ]' is a shell expression [ -z "foo" ] is an array of strings
    branch: git branch --show-current
    repo: |
      url="$(git remote -v|grep 'fetch'|grep 'origin'|head -1|tail -c +7|head -c -8|xargs)"
      [[ "git" == "${url:0:3}" ]] && echo $url|grep -oE ':([^\.]+)'|tail -c +2 && exit 0
      [[ "http" == "${url:0:4}" ]] && echo $url|grep -oE '[^\/]\/[a-z].*'|tail -c +3 && exit 0
      exit 1
    # --- git hash snippets:  clog git tag <snippet> -------------------------------------------------------------------
    hash:
      head: git rev-list -1 HEAD
      origin: git ls-remote --head --sort=-v:refname origin | grep $(clog BC git get branch) | head -1 | head -c 40
    # --- git message snippets:  clog git tag <snippet> ----------------------------------------------------------------
    message:
      latest: git log HEAD | head -5 | tail -1 | xargs
      # this is the default snippet to return the target commit message for
      # your project override in your project' clog.yaml
      ref: yq -r '.[0].note' "$(clog BC releases get path)"
    origin: git config --get remote.origin.url
    # --- git suffix snippets:  clog git suffix - added to a release ---------------------------------------------------
    suffix: |
      b="$(git branch --show-current)"
      [[ "$b" == main ]] && echo "" || echo "$b"|tr -d '[:blank:]'
    # --- git tag snippets:  clog git tag <snippet> --------------------------------------------------------------------
    tag:
      head: git tag --points-at HEAD
      latest: git tag --sort=committerdate | tail -1
      origin: git ls-remote --tags --sort=-v:refname origin | head -1 | grep -oE 'v{0,1}[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z0-0]+){0,1}'
      # the build's version from git (releases.yaml is history):
      # v1.2.3 on a release tag, else v1.2.3+dev.N.gSHA
      ref: clog BC gen buildinfo --format version
      tidy: 'echo "try:  clog BC git tag tidy"'
    # --- git tree snippets:  clog git tree <snippet> ------------------------------------------------------------------
    tree:
      ahead: if [ "$(git status|grep -oE '(branch is ahead)')" ];then echo "Branch ahead - do push ";exit 1;else echo "ok";fi
      behind: if [ "$(git status|grep -oE '(merge the remote)')" ];then echo "Branch behind - do pull";exit 1;else echo "ok";fi
      clean: if [ "$(git status|grep -oE '(working tree clean)')" ];then echo "ok";else echo "Working tree not clean";exit 1;fi
    unstaged: if [ "$(git status|grep -oE '(Changes not staged)')" ];then echo "Commit unstaged changes";exit 1; else echo "ok";fi
    # deprecated - use clog BC git tag get ref
    vcode: clog BC git tag get ref
    # walk the parent repos to see if they're unclean
    parents: |
      eval "$(clog Inc)" # set color strings
      root=..
      [ -n "$GIT_WALK_REPOS_ROOT" ] && root="$GIT_WALK_REPOS_ROOT"
      clean="  $cS clean✅$cX "
      dirty="$cE unclean❌$cX "
      for i in $root/* ; do
        status="$clean"
        xtra=""
        if [ ! -d "$i/.git" ]; then
          status="   $cI skip🧱 non-git folder$cT "
        else
          cd $i
          [ -n "$(git status | grep "hange")" ] && status="$dirty" && xtra="$xtra❌(${cW}commit changes${cX}) "
          clog git tree ahead >/dev/null; [ $? -gt 0 ]  && status="$dirty" && xtra="$xtra❌(${cW}push changes${cX}) "
          clog git tree behind >/dev/null; [ $? -gt 0 ] && status="$dirty" && xtra="$xtra❌(${cW}pull updates${cX}) "
        fi
        printf "$status$i$cX $xtra\n"
      done
  # ▼▼▼ install ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  #          _               _            _   _
  #   ||_   (_)  _ _    ___ | |_   __ _  | | | |
  #  (_-<   | | | ' \  (_-< |  _| / _` | | | | |
  #  / _/   |_| |_||_| /__/  \__| \__,_| |_| |_|
  #   ||
  getapp:
    # --- snippets to check install
    # clog Install have golang && echo "Yay, found it" || clog Install golang
    have:
      clog: "    clog --version >/dev/null 2>&1"
      godoc: "  which godoc       >/dev/null 2>&1"
      nvm: "      nvm --version >/dev/null 2>&1"
      yarn: "    yarn --version >/dev/null 2>&1"
    # install snippets --------------------------------------------------------

    godoc: |
      go install golang.org/x/tools/cmd/godoc@latest
    git-lfs: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
      sudo apt-get install git-lfs
    homebrew: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      [[ "$(uname -m)" == "arm64" ]] && clog Log -W "arm is badly supported!"
      sudo apt-get install -y build-essential procps curl file git
      curl -fSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh | bash
    minikube: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64 \
      && sudo install minikube-linux-amd64 /usr/local/bin/minikube
    nginx: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      sudo apt-get -qq update;  sudo apt-get -yq upgrade
      sudo apt-get install -yq nginx
      if [ -n "$(which ufw)" ]; then
        sudo ufw allow "Nginx Full" > /dev/null   # Allow HTTP, HTTPS
        sudo ufw reload
      fi
      sudo chown -R $USER:$USER /var/www
      # give some status & check config
      systemctl status nginx | grep "Active"
      sudo nginx -t
      if [[ $? -gt 0 ]] ; then
          clog Log -E "$cE nginx -t$cT shows config doesn't work - try again"
      else
          #restart nginx
          sudo systemctl -q restart nginx
      fi
    node-red: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      docker run --detach -p 1880:1880 -v $HOME/.node-red:/data --name nodered --rm nodered/node-red
    nvm: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      curl https://raw.githubusercontent.com/creationix/nvm/master/install.sh | bash
    op: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      clog Log -I "Installing 1password CLI for Debian"
      curl -sS https://downloads.1password.com/linux/keys/1password.asc | \
      sudo gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg && \
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/$(dpkg --print-architecture) stable main" | \
      sudo tee /etc/apt/sources.list.d/1password.list && \
      sudo mkdir -p /etc/debsig/policies/AC2D62742012EA22/ && \
      curl -sS https://downloads.1password.com/linux/debian/debsig/1password.pol | \
      sudo tee /etc/debsig/policies/AC2D62742012EA22/1password.pol && \
      sudo mkdir -p /usr/share/debsig/keyrings/AC2D62742012EA22 && \
      curl -sS https://downloads.1password.com/linux/keys/1password.asc | \
      sudo gpg --dearmor --output /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg && \
      sudo apt update && sudo apt install 1password-cli
    protoc: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      sudo apt-get install -y protobuf-compiler
    snap: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      sudo apt install -y snapd
    spin: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      curl -fsSL https://spinframework.dev/downloads/install.sh | bash
      sudo mv spin /usr/local/bin/
    terraform: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      #tbd mac - brew tap hashicorp/tap
      #tbd brew install hashicorp/tap/terraform
      sudo apt-get update && sudo apt-get install -y gnupg software-properties-common
      wget -O- https://apt.releases.hashicorp.com/gpg | \
      gpg --dearmor | \
      sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
      # verify the gpg key:
      gpg --no-default-keyring --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg --fingerprint
      # add the official Hashicorp repo
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
      sudo apt-get update
      sudo apt-get install terraform
      terraform -version && exit 0
      exit 1
    yarn: |
      [[ "$1" == "+logging" ]] && fnLog() { clog Log -I "$1 $2 $3"; } || fnLog() { :; }
      npm install --global yarn && echo "PATH=\"$PATH:$(yarn global bin)\"" >> ~/.bashrc
  # ▼▼▼ deb ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
    # ------------------------------------------------------------------------------------------------------------------
    # ---  Mr MXF clog snippets - not in main core
    # ------------------------------------------------------------------------------------------------------------------
    # ANTIQUE. This predates .clog.yaml and has not been reworked.
    #
    # It used to lean on `clog Init` leaving a clogrc/clog.yaml behind. That
    # path is no longer searched and Init now writes .clog.sample.yaml, so the
    # host's deb config is .clog.deb.yaml, written explicitly here.
    #
    # clogrc/ survives below only as a SCRIPT folder - deb0.sh, certs.sh and
    # the backup/restore scripts all live there and deb0.sh mkdir -p's it. That
    # is a different thing from config and is left alone.
    deb: |
      clog Cat tpl/clog.yaml > .clog.deb.yaml
      clog Cat core/deb/deb0.sh > clogrc/deb0.sh
      clog deb0

  # ▼▼▼ my ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  # 
  #   ||_    _ __    _  _
  #  (_-<   | '  \  | || |
  #  / _/   |_|_|_|  \_, |
  #   ||             |__/
  my:
    ip: curl -s wtfismyip.com/text
    uid: echo $UID
    usr: echo $USER
    home: echo ~
    wslusr: echo "$(wslvar USERPROFILE)"
    wslhome: echo "$(wslpath "$(wslvar USERPROFILE)")" 
  # ▼▼▼ project ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
  #                               _              _
  #   ||_    _ __   _ _   ___    (_)  ___   __  | |_
  #  (_-<   | '_ \ | '_| / _ \   | | / -_) / _| |  _|
  #  / _/   | .__/ |_|   \___/  _/ | \___| \__|  \__|
  #   ||    |_|                |__/
  # typically used for global tool version propagation, node version etc.
  project:
    needs:
      golang: cat go.mod|grep '^go '|grep -oE '[0-9]\.[0-9]+\.[0-9]+'
      hugo: hugo config --format yaml|yq -r '.module.hugoversion.min'|cut -c 2-20
      node: echo "23.8.0"
