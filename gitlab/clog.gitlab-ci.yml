#
#  clog.gitlab-ci.yml - GitLab twin of the mrmxf/util GitHub workflows
#
#  Same shape as build.yaml / deploy-s3 on GitHub: no CI/CD variables hold
#  secrets. Each job gets clog, asks ci.policy (clog CI should) whether to act,
#  and runs its work under `clog CI run`, which logs in to Infisical with the
#  job's OIDC id_token. A run is dev or prod (no staging) and deploys once per
#  ci.targets entry. Config: clog CI --config-help.
#
#  This tracks build.yaml's generation, not build-golang's: the toolchain comes
#  from ci.stack rather than being hardcoded per language, the build writes its
#  SARIF into the canonical artifact tree, and the deploy probes what it just
#  published. A repo declares its stack once and both platforms read it.
#
#  Use from a project's .gitlab-ci.yml:
#
#    include:
#      - remote: https://raw.githubusercontent.com/mrmxf/util/workflows-v1/gitlab/clog.gitlab-ci.yml
#        inputs:
#          audience: https://eu.infisical.com   # = ci.infisical.domain = identity Audiences
#          self-build: true                     # clog repos only
#
#  Jobs provided: clog-build (stage build), clog-deploy (stage deploy).
#  Hidden job .clog-prepare can be extended for custom verbs:
#    my-job: {extends: .clog-prepare, script: ["clog ci should build || exit 0", "clog ci run -- clog my-verb"]}

spec:
  inputs:
    audience:
      description: OIDC audience for INFISICAL_ID_TOKEN (the Infisical domain)
    self-build:
      type: boolean
      default: false
      description: build clog from this repository (clog repos) instead of downloading a release
    image:
      default: golang:1.26-bookworm
      description: job image; needs bash, curl and (for self-build) Go matching go.mod
    clog-version:
      default: ""
      description: clog release tag when not self-building ('' = .clog-version)
    clog-repo:
      default: mrmxf/clog-sample
      description: GitHub owner/repo holding the clog release
    artifact-paths:
      type: array
      # The canonical layout: _clog_build holds artifacts, the check stash and
      # SARIF; _clog_deploy holds receipts and probe findings. kodata is here
      # because a Hugo site's publishDir is set in hugo.yaml rather than by
      # clog, so those repos still publish from outside the tree.
      default: ["_clog_build/", "_clog_deploy/", "kodata/"]
      description: build outputs handed from clog-build to clog-deploy
    stack:
      default: ""
      description: which ci.stack entry to act on ('' = every stack)
---
.clog-prepare:
  image: $[[ inputs.image ]]
  id_tokens:
    INFISICAL_ID_TOKEN:
      aud: $[[ inputs.audience ]]
  variables:
    GIT_DEPTH: 0              # clog BC git needs tags and history
    GIT_STRATEGY: clone
  before_script:
    - |
      if [ "$[[ inputs.self-build ]]" = "true" ]; then
        go build -o /usr/local/bin/clog .
      else
        curl -fsSL "https://raw.githubusercontent.com/mrmxf/util/workflows-v1/.github/actions/setup-clog/get-clog.sh" -o /tmp/get-clog.sh
        CLOG_DIR="$(CLOG_VERSION="$[[ inputs.clog-version ]]" CLOG_REPO="$[[ inputs.clog-repo ]]" CLOG_INSTALL_DIR=/usr/local/bin bash /tmp/get-clog.sh)"
        export PATH="$CLOG_DIR:$PATH"
      fi
    - clog --version
    - clog CI show policy

clog-build:
  extends: .clog-prepare
  stage: build
  script:
    - clog CI should build || exit 0
    # The stack decides the toolchain. clog never installs these behind your
    # back during a build - a verb that quietly pulls binaries onto a machine
    # while claiming to check a branch is the wrong supply-chain posture - so
    # the install is explicit, here, where the log shows it.
    - |
      for t in $(clog CI stack list tools --stack "$[[ inputs.stack ]]"); do
        clog Install "$t" --verbose || exit 1
      done
    # No --fast, and no input to pass one: --fast makes no claim about the
    # branch, so it has no business in CI.
    - clog CI run -- bash -c 'clog CI require build || exit 1; clog build $[[ inputs.stack ]]'
  artifacts:
    when: always
    expire_in: 1 day
    paths: $[[ inputs.artifact-paths ]]

clog-deploy:
  extends: .clog-prepare
  stage: deploy
  needs: [clog-build]
  script:
    - clog CI should deploy || exit 0
    # one clog deploy per ci.targets entry for this mode (D-I.14)
    - |
      for t in $(clog CI target list); do
        echo "--- deploy $t ($(clog CI mode show))"
        CLOG_TARGET="$t" clog CI run -- bash -c 'clog CI require deploy || exit 1; clog CI deploy --target "$CLOG_TARGET"' || exit 1
      done
    # Probe what was just published. It runs after the deploy because that is
    # the only point at which the questions mean anything, and it does not gate:
    # the deploy has already happened, so failing here could not un-publish it.
    - clog CI probe || true
