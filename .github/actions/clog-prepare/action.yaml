#  BSD-3-Clause License           https://opensource.org/license/bsd-3-clause/
#
#  clog-prepare - the shared first step of every mrmxf/util build/deploy job
#
#    checkout → Go (from go.mod) → clog (built from this repo, or a pinned
#    release) → clog ci resolve + clog ci policy + ci.* values into $GITHUB_ENV
#
#  After it, a job's steps gate on env.do_build / env.do_deploy and run their
#  work through `clog ci run -- …`, which fetches Infisical secrets via OIDC.
#  The calling job needs  permissions: {contents: read, id-token: write}.
#
#  Values added to $GITHUB_ENV:
#    clog ci resolve : ci verb ref repo url depth actor is_production is_tag
#    clog ci policy  : build_mode deploy_mode do_build do_deploy deploy_targets
#    clog ci get     : ci_artifact ci_title
#
#  There is no staging: a run is dev or prod (D-I.12), and deploy destinations
#  are ci.targets entries - the deploy step runs once per target.
#
#  Setup of .clog.yaml and Infisical: clog ci --config-help

name: clog-prepare
description: checkout, install Go + clog, and decide build/deploy from .clog.yaml

inputs:
  self-build:
    description: '"true" = build clog from this repository (clog repos); otherwise download a release'
    required: false
    default: "false"
  self-build-path:
    description: path of the clog main package when self-build is true
    required: false
    default: "."
  clog-ref:
    description: clog release tag to install (default reads .clog-version); ignored for self-build
    required: false
    default: ""
  clog-repo:
    description: GitHub owner/repo holding the clog release; ignored for self-build
    required: false
    default: mrmxf/clog-sample
  token:
    description: token for a private clog release repo (optional)
    required: false
    default: ""
  production:
    description: >-
      "true" = check out the newest release tag and force prod mode, whatever
      triggered the run. A scheduled run already does this (ci resolve sets
      is_production); this lets a caller ask for it on a manual run, so
      "rebuild and republish the current release" is one click in the Actions
      tab rather than a tag push.
    required: false
    default: "false"

outputs:
  do_build:
    description: "true when ci.policy allows a build"
    value: ${{ steps.plan.outputs.do_build }}
  do_deploy:
    description: "true when ci.policy allows a deploy"
    value: ${{ steps.plan.outputs.do_deploy }}

runs:
  using: composite
  steps:
    - name: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0            # clog BC git needs tags and history
        lfs: true
        submodules: recursive

    - name: go version file
      id: gomod
      shell: bash
      run: |
        f="${{ inputs.self-build-path }}/go.mod"
        [ -f "$f" ] && echo "file=$f" >> "$GITHUB_OUTPUT" || echo "file=" >> "$GITHUB_OUTPUT"

    - name: setup go (from go.mod)
      if: steps.gomod.outputs.file != ''
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: ${{ steps.gomod.outputs.file }}

    - name: build clog from this repository
      if: inputs.self-build == 'true'
      shell: bash
      run: |
        dir="$RUNNER_TEMP/clog-bin"; mkdir -p "$dir"
        go build -o "$dir/clog" "${{ inputs.self-build-path }}"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/clog" --version

    - name: install clog release
      if: inputs.self-build != 'true'
      uses: mrmxf/util/.github/actions/setup-clog@workflows-v1
      with:
        clog-ref: ${{ inputs.clog-ref }}
        clog-repo: ${{ inputs.clog-repo }}
        token: ${{ inputs.token }}

    # Force prod BEFORE the policy runs, so build_mode/deploy_mode/do_deploy are
    # all decided as a production run rather than patched up afterwards.
    # Only CLOG_MODE is set here: `clog ci resolve` writes is_production in the
    # next step, and a later $GITHUB_ENV line wins, so setting it here would be
    # silently undone.
    - name: force production mode
      if: inputs.production == 'true'
      shell: bash
      run: echo "CLOG_MODE=prod" >> "$GITHUB_ENV"

    - name: resolve event + ci.policy
      id: plan
      shell: bash
      run: |
        clog ci resolve --format env >> "$GITHUB_ENV"
        clog ci policy  --format env | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
        {
          echo "ci_artifact=$(clog ci get ci.artifact)"
          echo "ci_title=$(clog ci get ci.title)"
        } >> "$GITHUB_ENV"
        clog ci policy

    # Scheduled runs, and any caller passing production: true.
    - name: production checkout (newest release tag)
      if: env.is_production == 'true' || inputs.production == 'true'
      shell: bash
      run: clog BC git checkout production
