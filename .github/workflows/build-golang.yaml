#
#  build-golang — callable workflow: multiplatform Go build via `clog build`.
#
#  v1 (Infisical): no secrets are passed in. clog-prepare decides from the
#  caller's .clog.yaml (ci.policy) whether this run builds; build steps run
#  under `clog ci run`, which fetches Infisical secrets with the job's OIDC
#  token. Config: clog ci --config-help.
#
#  Caller:
#    permissions: {contents: read, id-token: write}
#    jobs:
#      build:
#        uses: mrmxf/util/.github/workflows/build-golang.yaml@workflows-v1
#        permissions: {contents: read, id-token: write}
#        with: {self-build: true}        # clog repos only

name: build-golang
run-name: ${{ github.workflow }}(${{ github.event_name }}) 🥷${{ github.actor }}

on:
  workflow_call:
    inputs:
      self-build: { required: false, type: boolean, default: false }  # build clog from this repo
      make:       { required: false, type: string,  default: "" }     # MAKE override for clog build
      clog-ref:   { required: false, type: string,  default: "" }     # clog release (''=.clog-version)
      clog-repo:  { required: false, type: string,  default: mrmxf/clog-sample }
    secrets:
      clog_download_token: { required: false }  # only for a private clog release repo

permissions:
  contents: read
  id-token: write   # OIDC → Infisical

concurrency:
  group: build-golang-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-golang:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: prepare (checkout, go, clog, ci.policy)
        uses: mrmxf/util/.github/actions/clog-prepare@workflows-v1
        with:
          self-build: ${{ inputs.self-build }}
          clog-ref: ${{ inputs.clog-ref }}
          clog-repo: ${{ inputs.clog-repo }}
          token: ${{ secrets.clog_download_token }}

      - name: login to Docker Hub (DOCKER_PAT from Infisical)
        if: env.do_build == 'true' && env.ci_docker_ns != ''
        run: clog ci run -- bash -c 'printf %s "$DOCKER_PAT" | docker login -u "$ci_docker_ns" --password-stdin'

      - name: install toolchain (slsa-verifier, ko)
        if: env.do_build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub API rate limit for version lookups
        run: |
          clog Install slsa-verifier --verbose
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          clog Install ko --verbose

      - name: build (clog ci run -- clog build)
        if: env.do_build == 'true'
        env:
          MAKE: ${{ inputs.make }}
        run: |
          clog ci run -- bash -c '
            clog ci require build || exit 1
            if [ -z "$MAKE" ]; then clog build; else clog build MAKE "$MAKE"; fi'

      - name: upload artifact ${{ env.ci_artifact }}
        if: env.do_build == 'true' && env.ci_artifact != ''
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ env.ci_artifact }}
          retention-days: 2
          path: tmp

      - name: notify-team (slack, HOOK_SLACK from Infisical)
        if: always() && env.do_build == 'true'
        env:
          MD: "• build ${{ env.clog_env }} ${{ env.ref }} by ${{ env.actor }}\n• ${{ env.url }}\n• run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
        run: |
          clog ci run -- bash -c '
            [ -z "${HOOK_SLACK:-}" ] && { clog Log -W "HOOK_SLACK not set - no Slack notify"; exit 0; }
            clog SlackStash "${ci_title:-build} ($clog_env)" --md "$MD"'
