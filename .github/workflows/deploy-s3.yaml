#
#  deploy-s3 — callable workflow: deploy the build artifact via `clog deploy`.
#  (the name is historical: the destinations are ci.targets entries, of any kind)
#
#  v1 (Infisical): no secrets are passed in. clog-prepare decides from the
#  caller's .clog.yaml (ci.policy) whether this run deploys and in which mode
#  (dev|prod); the destinations are its ci.targets entries and the step runs
#  `clog deploy` once per target, each with $CLOG_TARGET set. Secrets come from
#  Infisical through `clog ci run`, and `clog ci require deploy` (target's
#  require list included) stops the job before any upload if one is missing.
#  Config: clog ci --config-help.
#
#  Caller:
#    jobs:
#      deploy:
#        needs: [build]
#        uses: mrmxf/util/.github/workflows/deploy-s3.yaml@workflows-v1
#        permissions: {contents: read, id-token: write}
#        with: {self-build: true}        # clog repos only

name: deploy-s3
run-name: ${{ github.workflow }}(${{ github.event_name }}) 🥷${{ github.actor }}

on:
  workflow_call:
    inputs:
      self-build: { required: false, type: boolean, default: false }
      make:       { required: false, type: string,  default: "" }  # MAKE override for clog deploy
      clog-ref:   { required: false, type: string,  default: "" }
      clog-repo:  { required: false, type: string,  default: mrmxf/clog-sample }
      production: { required: false, type: boolean, default: false }  # build/deploy the newest release tag
    secrets:
      clog_download_token: { required: false }

permissions:
  contents: read
  id-token: write   # OIDC → Infisical

concurrency:
  group: deploy-s3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  deploy-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: prepare (checkout, go, clog, ci.policy)
        uses: mrmxf/util/.github/actions/clog-prepare@workflows-v1
        with:
          self-build: ${{ inputs.self-build }}
          production: ${{ inputs.production }}
          clog-ref: ${{ inputs.clog-ref }}
          clog-repo: ${{ inputs.clog-repo }}
          token: ${{ secrets.clog_download_token }}

      - name: download artifact ${{ env.ci_artifact }} → tmp/
        if: env.do_deploy == 'true' && env.ci_artifact != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ env.ci_artifact }}
          path: .

      - name: deploy ${{ env.deploy_targets }} (one clog deploy per target)
        if: env.do_deploy == 'true'
        env:
          MAKE: ${{ inputs.make }}
        run: |
          for t in $deploy_targets; do
            echo "::group::deploy $t (${{ env.deploy_mode }})"
            CLOG_TARGET="$t" clog ci run -- bash -c '
              clog ci require deploy || exit 1
              if [ -z "$MAKE" ]; then clog deploy; else clog deploy MAKE "$MAKE"; fi' || exit 1
            echo "::endgroup::"
          done

      - name: notify-team (slack, HOOK_SLACK from Infisical)
        if: always() && env.do_deploy == 'true'
        env:
          MD: "• deploy ${{ env.deploy_mode }} ${{ env.ref }} by ${{ env.actor }}\n• ${{ env.url }}\n• run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
        run: |
          clog ci run -- bash -c '
            [ -z "${HOOK_SLACK:-}" ] && { clog Log -W "HOOK_SLACK not set - no Slack notify"; exit 0; }
            clog SlackStash "${ci_title:-deploy} ($deploy_mode)" --md "$MD"'
