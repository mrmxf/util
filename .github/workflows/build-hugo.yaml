#
#  build-hugo — callable workflow: build a Hugo site to a container via hugo+ko.
#
#  v1 (Infisical): no secrets are passed in. clog-prepare decides from the
#  caller's .clog.yaml (ci.policy, incl. ci.policy.actors) whether this run
#  builds; DOCKER_PAT and HOOK_SLACK come from Infisical through `clog ci run`.
#  The Docker namespace is .clog.yaml config (ci.docker-ns). The Cloudflare
#  bypass is gone: clog now comes from a GitHub release, not mrmxf.com.
#  Config: clog ci --config-help.
#
#  Caller:
#    jobs:
#      build:
#        uses: mrmxf/util/.github/workflows/build-hugo.yaml@workflows-v1
#        permissions: {contents: read, id-token: write}

name: build-hugo
run-name: ${{ github.workflow }}(${{ github.event_name }}) 🥷${{ github.actor }}

on:
  workflow_call:
    inputs:
      make:      { required: false, type: string, default: "" }  # MAKE override for clog build
      clog-ref:  { required: false, type: string, default: "" }
      clog-repo: { required: false, type: string, default: mrmxf/clog-sample }
      production: { required: false, type: boolean, default: false }  # build/deploy the newest release tag
    secrets:
      clog_download_token: { required: false }

permissions:
  contents: read
  id-token: write   # OIDC → Infisical

concurrency:
  group: build-hugo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hugo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: prepare (checkout, go, clog, ci.policy)
        uses: mrmxf/util/.github/actions/clog-prepare@workflows-v1
        with:
          production: ${{ inputs.production }}
          clog-ref: ${{ inputs.clog-ref }}
          clog-repo: ${{ inputs.clog-repo }}
          token: ${{ secrets.clog_download_token }}

      - name: login to the container registry (DOCKER_PAT from Infisical)
        if: env.do_deploy == 'true'
        run: |
          t="$(clog ci targets --kind container-registry | head -1)"
          [ -z "$t" ] && { clog Log -I "no container-registry target - no docker login"; exit 0; }
          CLOG_TARGET="$t" clog ci run -- bash -c \
            'printf %s "$DOCKER_PAT" | docker login -u "$(clog ci target get user --required)" --password-stdin'

      - name: install toolchain (slsa-verifier, hugo, ko)
        if: env.do_build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub API rate limit for version lookups
        run: |
          clog Install slsa-verifier --verbose
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          clog Install hugo --verbose
          clog Install ko   --verbose

      - name: build (clog ci run -- clog build, mode ${{ env.build_mode }})
        if: env.do_build == 'true'
        env:
          MAKE: ${{ inputs.make }}
        run: |
          clog ci run -- bash -c '
            clog ci require build || exit 1
            if [ -z "$MAKE" ]; then clog build; else clog build MAKE "$MAKE"; fi'

      - name: scan image
        if: env.do_deploy == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.repo }}
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: upload artifact ${{ env.ci_artifact }}
        if: env.do_build == 'true' && env.ci_artifact != ''
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ env.ci_artifact }}
          retention-days: 2
          path: |
            kodata
            tmp

      - name: notify-team (slack, HOOK_SLACK from Infisical)
        if: always() && env.do_build == 'true'
        env:
          MD: "• build ${{ env.build_mode }} ${{ env.ref }} by ${{ env.actor }}\n• ${{ env.url }}\n• run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
        run: |
          clog ci run -- bash -c '
            [ -z "${HOOK_SLACK:-}" ] && { clog Log -W "HOOK_SLACK not set - no Slack notify"; exit 0; }
            clog SlackStash "${ci_title:-build} ($build_mode)" --md "$MD"'
